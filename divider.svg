<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="presentation">
<defs>
<linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#00B4D8" stop-opacity="0"/><stop offset=".35" stop-color="#00B4D8" stop-opacity=".7"/><stop offset=".5" stop-color="#D4AF37"/><stop offset=".65" stop-color="#00B4D8" stop-opacity=".7"/><stop offset="1" stop-color="#00B4D8" stop-opacity="0"/></linearGradient>
<linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
