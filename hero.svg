<animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="1s" fill="freeze"/></text>
<text x="70" y="306" font-family="'Fira Code','SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="16" fill="#00B4D8" opacity="0">Turning bugs into features and commits into therapy.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.03;.30;.333;1" dur="12s" begin="1.6s" repeatCount="indefinite"/></text>
<text x="70" y="306" font-family="'Fira Code','SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="16" fill="#00B4D8" opacity="0">Sistemas ERP que crescem ao ritmo do seu negócio.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.333;.363;.63;.666;1" dur="12s" begin="1.6s" repeatCount="indefinite"/></text>
<text x="70" y="306" font-family="'Fira Code','SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="16" fill="#00B4D8" opacity="0">Automação · APIs · Mobile — de Luanda para o mundo.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.666;.696;.96;1" dur="12s" begin="1.6s" repeatCount="indefinite"/></text>
